name: CI

# Gate every push and PR on lint + formatting + a green build + unit tests, so a
# regression in the pure logic libs (recurrence, parsing, ordering, privacy …)
# or a style/lint slip can't merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
